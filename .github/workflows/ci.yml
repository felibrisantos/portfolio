name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Four steps on purpose. A slow or noisy pipeline on a one-page site gets
  # ignored within a month, and a gate that is ignored is not a gate.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # build before test: the markup seam asserts over what the build emits
      - run: npm run build
      - run: npm test
